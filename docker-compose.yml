name: waha-n8n

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      n8n:
        condition: service_healthy
      waha:
        condition: service_started

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./certs/postgres/server.crt:/etc/postgresql/tls/server.crt:ro
      - ./certs/postgres/server.key:/etc/postgresql/tls/server.key:ro
      - ./initdb/01-create-n8n-user.sh:/docker-entrypoint-initdb.d/01-create-n8n-user.sh:ro
    networks:
      backend:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      # Externamente: TLS em IP_PUBLICO:6379.
      # Internamente: os containers usam redis:6379 sem TLS, dentro da rede privada Docker.
      - "6379:6380"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./certs/redis/server.crt:/tls/server.crt:ro
      - ./certs/redis/server.key:/tls/server.key:ro
      - ./certs/ca.crt:/tls/ca.crt:ro
    networks:
      backend:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  n8n:
    image: docker.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: 2
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_FOLDER: /home/node/.n8n
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_LOG_LEVEL: info
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public
      EXECUTIONS_MODE: regular
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      N8N_REINSTALL_MISSING_PACKAGES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared:/files
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  waha:
    image: ${WAHA_IMAGE}
    command: ["/bin/sh", "-c", "node /opt/waha-n8n/dashboard-bootstrap.cjs && exec /entrypoint.sh"]
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE}
      WAHA_NAMESPACE: all
      WAHA_SESSION_NAMESPACE: ${WAHA_ENGINE}
      WAHA_PUBLIC_URL: https://${WAHA_DOMAIN}
      WAHA_BASE_URL: https://${WAHA_DOMAIN}
      WAHA_LOG_LEVEL: info

      WAHA_API_KEY: sha512:${WAHA_API_KEY_SHA512}
      WAHA_API_KEY_PLAIN: ${WAHA_API_KEY_PLAIN}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_ENABLED: "true"
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_SWAGGER_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_SWAGGER_PASSWORD}

      WAHA_APPS_ENABLED: "true"
      # DB 1 reservado ao WAHA. DB 0 fica livre para os workflows do n8n.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/1

      # Crie/publice no n8n um Webhook com o caminho definido em WAHA_N8N_WEBHOOK_PATH.
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/${WAHA_N8N_WEBHOOK_PATH}
      WHATSAPP_HOOK_EVENTS: ${WAHA_WEBHOOK_EVENTS}
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY}
      WHATSAPP_HOOK_RETRIES_POLICY: linear
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: 2
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: 5
    volumes:
      - ./scripts/waha-dashboard-bootstrap.cjs:/opt/waha-n8n/dashboard-bootstrap.cjs:ro
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks:
      - frontend
      - backend
    depends_on:
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy

networks:
  frontend:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  redis_data:
  n8n_data:
  waha_sessions:
  waha_media:
  caddy_data:
  caddy_config:
